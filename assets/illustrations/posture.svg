<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" role="img" aria-labelledby="title desc">
<title id="title">Dijete udobno sjedi i drži klasičnu gitaru</title><desc id="desc">Desnoruki položaj: leđa uspravna, ramena opuštena. Desna ruka svira iznad zvučnog otvora, lijeva ruka doseže vrat. Gitara je oslonjena na lijevu nogu, a lijevo stopalo na podnožak. Drugo stopalo je na podu.</desc>
