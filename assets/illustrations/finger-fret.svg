<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="Prst na pragu">
  <rect width="560" height="260" rx="20" fill="#fff5fb"/>
  <!-- vrat -->
  <rect x="60" y="60" width="440" height="100" rx="6" fill="#e8c48a" stroke="#8d6e4a" stroke-width="2"/>
  <!-- pragovi -->
  <rect x="60" y="60" width="16" height="100" fill="#f5efe4" stroke="#8d6e4a" stroke-width="1"/>
  <line x1="180" y1="60" x2="180" y2="160" stroke="#5d4037" stroke-width="6"/>
  <line x1="300" y1="60" x2="300" y2="160" stroke="#5d4037" stroke-width="4"/>
  <line x1="420" y1="60" x2="420" y2="160" stroke="#5d4037" stroke-width="4"/>
  <!-- zice -->
  <line x1="70" y1="85" x2="490" y2="85" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="70" y1="110" x2="490" y2="110" stroke="#ec407a" stroke-width="3.5"/>
  <line x1="70" y1="135" x2="490" y2="135" stroke="#ff9800" stroke-width="3.5"/>
  <!-- prst blizu precke -->
  <ellipse cx="155" cy="110" rx="20" ry="14" fill="#ffccbc" stroke="#e57373" stroke-width="2"/>
  <!-- broj 1 -->
  <circle cx="230" cy="110" r="20" fill="#ec407a"/>
  <text x="230" y="118" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial,sans-serif" font-weight="bold">1</text>
  <!-- strelice -->
  <text x="155" y="200" text-anchor="middle" fill="#c2185b" font-size="15" font-family="Arial,sans-serif" font-weight="bold">prst</text>
  <text x="180" y="40" text-anchor="middle" fill="#5d4037" font-size="14" font-family="Arial,sans-serif" font-weight="bold">prečka</text>
  <path d="M180 48 L180 58" stroke="#5d4037" stroke-width="2"/>
</svg>
